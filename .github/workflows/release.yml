name: Build release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic version tag to build, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Select pinned .NET SDK
        shell: pwsh
        run: |
          # Older tags may predate global.json. Generate the same SDK contract
          # used by current source without changing the tagged source itself.
          if (-not (Test-Path '.\global.json')) {
              dotnet new globaljson `
                  --sdk-version 9.0.100 `
                  --roll-forward latestFeature
              if ($LASTEXITCODE -ne 0) {
                  throw 'Could not create the temporary SDK selection file.'
              }
          }

          $sdkVersion = dotnet --version
          if ($sdkVersion -notmatch '^9\.0\.\d+$') {
              throw "Expected a .NET 9 SDK, received '$sdkVersion'."
          }

      - name: Validate tag, project version, and changelog
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
              throw "Release tag must use vMAJOR.MINOR.PATCH, received '$env:RELEASE_TAG'."
          }

          $tagVersion = $Matches.version
          [xml]$project = Get-Content '.\src\ModularGameOverlay.App\ModularGameOverlay.App.csproj'
          $projectVersion = $project.SelectSingleNode('//Version').InnerText
          if ($projectVersion -ne $tagVersion) {
              throw "Tag version '$tagVersion' does not match project version '$projectVersion'."
          }

          $changelog = [IO.File]::ReadAllText('.\CHANGELOG.md', [Text.Encoding]::UTF8)
          if ($changelog -notmatch "(?m)^## \[$([regex]::Escape($tagVersion))\] - \d{4}-\d{2}-\d{2}\r?$") {
              throw "CHANGELOG.md does not contain a dated [$tagVersion] release heading."
          }

          "RELEASE_VERSION=$tagVersion" >> $env:GITHUB_ENV

      - name: Build and verify release assets
        shell: pwsh
        run: .\scripts\build-release.ps1 -Version $env:RELEASE_VERSION

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repository = $env:GITHUB_REPOSITORY
          $assetDirectory = ".\artifacts\release\$env:RELEASE_TAG"
          $executable = Join-Path $assetDirectory 'ModularGameOverlay-win-x64.exe'
          $license = Join-Path $assetDirectory 'LICENSE.txt'
          $thirdPartyNotices = Join-Path $assetDirectory 'THIRD-PARTY-NOTICES.txt'
          $checksums = Join-Path $assetDirectory 'SHA256SUMS.txt'

          gh release view $env:RELEASE_TAG --repo $repository *> $null
          if ($LASTEXITCODE -eq 0) {
              gh release upload $env:RELEASE_TAG `
                  $executable `
                  $license `
                  $thirdPartyNotices `
                  $checksums `
                  --clobber `
                  --repo $repository
          }
          else {
              gh release create $env:RELEASE_TAG `
                  $executable `
                  $license `
                  $thirdPartyNotices `
                  $checksums `
                  --generate-notes `
                  --latest `
                  --repo $repository `
                  --title "ModularGameOverlay $env:RELEASE_TAG" `
                  --verify-tag
          }
