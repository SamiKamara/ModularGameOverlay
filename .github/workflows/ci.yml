name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Confirm pinned .NET SDK
        shell: pwsh
        run: |
          $sdkVersion = dotnet --version
          if ($sdkVersion -notmatch '^9\.0\.\d+$') {
              throw "Expected a .NET 9 SDK, received '$sdkVersion'."
          }

      - name: Restore
        run: dotnet restore .\ModularGameOverlay.sln

      - name: Verify formatting
        run: dotnet format .\ModularGameOverlay.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build .\ModularGameOverlay.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test .\ModularGameOverlay.sln --configuration Release --no-build --logger "trx;LogFileName=tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
